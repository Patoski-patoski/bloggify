openapi: 3.0.0
info:
  title: My API Documentation
  version: 1.0.0
  description: This is the API documentation for my project.
servers:
  - url: http://localhost:3000
    description: Development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

apis: ['./src/routes/*.js']
      
paths:
  /users:
    get:
      summary: Retrieve a list of users (Requires Authentication)
      description: This route requires a valid JWT token for access.
      security:
        - bearerAuth: []
      responses:
        200:
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
  /profile:
    get:
      summary: Get user profile
      description: Retrieves the authenticated user's profile.
      security:
        - bearerAuth: []
      responses:
        200:
          description: User profile information
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
